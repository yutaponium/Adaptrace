name: Release binaries

# Builds the CLI as a single executable for each platform with
# `bun build --compile` and attaches it to the GitHub Release of the tag
# (ADR-038). A tag push creates a draft Release if none exists yet; the
# maintainer writes the notes and publishes it. Run it by hand to attach
# binaries to an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# A tag push and a manual run for the same tag must not create two Releases.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each binary is built on its own platform and run there before it
          # is attached. macOS binaries must be signed (ad hoc) to run on Apple
          # silicon, which Bun does on macOS.
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      # The build scripts come from the workflow's own commit, so that binaries
      # can also be attached to a tag made before the scripts existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)' | tr -d '\r')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Build
        run: |
          exe=adaptrace
          case "${{ matrix.target }}" in windows-*) exe=adaptrace.exe ;; esac
          # The archive holds one folder, so extracting it does not overwrite
          # files such as LICENSE in the current folder.
          dir="dist/adaptrace-$TAG-${{ matrix.target }}"
          mkdir -p "$dir"
          bun build --compile --minify --target="bun-${{ matrix.target }}" \
            src/cli.ts --outfile "$dir/$exe" --metafile=dist/meta.json
          cp LICENSE "$dir/"
          # The runtime is bundled too: add Bun's license for this version.
          curl -fsSL -o dist/BUN_LICENSE.md \
            "https://raw.githubusercontent.com/oven-sh/bun/bun-v$(bun --version | tr -d '\r')/LICENSE.md"
          bun .release-tools/scripts/licenses.ts dist/meta.json dist/BUN_LICENSE.md \
            "$dir/THIRD_PARTY_LICENSES.md"
          echo "DIR=$dir" >> "$GITHUB_ENV"
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          [ "$("$DIR/$EXE" --version | tr -d '\r')" = "${TAG#v}" ]
          "$DIR/$EXE" validate .adaptrace
      - name: Package
        run: |
          name="$(basename "$DIR")"
          cd dist
          case "${{ matrix.target }}" in
            windows-*) 7z a -tzip "$name.zip" "$name" > /dev/null ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/adaptrace-*.tar.gz
            dist/adaptrace-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum adaptrace-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the Release
        run: |
          # Create a draft only when the Release does not exist; any other
          # error stops the job.
          if ! out="$(gh release view "$TAG" 2>&1 > /dev/null)"; then
            if [ "$out" != "release not found" ]; then
              echo "$out"
              exit 1
            fi
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "See CHANGELOG.md for the changes in this version."
          fi
          gh release upload "$TAG" dist/* --clobber
