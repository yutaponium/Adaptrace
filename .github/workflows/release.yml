name: Release binaries

# Builds the CLI as a single executable for each platform with
# `bun build --compile` and attaches it to the GitHub Release of the tag
# (ADR-038). A tag push creates a draft Release if none exists yet; the
# maintainer writes the notes and publishes it. Run it by hand to attach
# binaries to an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run on the matching OS where it matters: macOS binaries must be
          # signed (ad hoc) to run on Apple silicon, which Bun does on macOS.
          - { os: ubuntu-latest, target: linux-x64, run: true }
          - { os: ubuntu-latest, target: linux-arm64, run: false }
          - { os: macos-latest, target: darwin-arm64, run: true }
          - { os: macos-latest, target: darwin-x64, run: false }
          - { os: windows-latest, target: windows-x64, run: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # The build scripts come from the workflow's own commit, so that binaries
      # can also be attached to a tag made before the scripts existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)' | tr -d '\r')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Build
        run: |
          exe=adaptrace
          case "${{ matrix.target }}" in windows-*) exe=adaptrace.exe ;; esac
          mkdir -p dist/pkg
          bun build --compile --minify --target="bun-${{ matrix.target }}" \
            src/cli.ts --outfile "dist/pkg/$exe" --metafile=dist/meta.json
          cp LICENSE dist/pkg/
          bun .release-tools/scripts/licenses.ts dist/meta.json dist/pkg/THIRD_PARTY_LICENSES.md
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.run
        run: |
          [ "$(dist/pkg/$EXE --version | tr -d '\r')" = "${TAG#v}" ]
          dist/pkg/$EXE validate .adaptrace
      - name: Package
        run: |
          name="adaptrace-$TAG-${{ matrix.target }}"
          cd dist/pkg
          case "${{ matrix.target }}" in
            windows-*) 7z a -tzip "../$name.zip" . > /dev/null ;;
            *) tar -czf "../$name.tar.gz" . ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/adaptrace-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum adaptrace-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the Release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "See CHANGELOG.md for the changes in this version."
          fi
          gh release upload "$TAG" dist/* --clobber
