name: アイデア・提案 / Idea or proposal
description: 機能の提案や設計の議論
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / Problem
      description: 実際のプロジェクトでの変更管理の課題など
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した他の案 / Alternatives considered
